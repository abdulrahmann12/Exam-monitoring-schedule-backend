spring.application.name=schdule-management-api

# Database Configuration
# rewriteBatchedStatements=true: activates true JDBC batching in MySQL driver so that
# Hibernate's hibernate.jdbc.batch_size setting actually sends statements in a single
# network round-trip instead of individual round-trips.
# development
spring.datasource.url=jdbc:mysql://db53163.public.databaseasp.net:3306/db53163?useSSL=true&requireSSL=false&serverTimezone=UTC&zeroDateTimeBehavior=convertToNull&rewriteBatchedStatements=true&cachePrepStmts=true&prepStmtCacheSize=250&prepStmtCacheSqlLimit=2048&connectTimeout=30000&socketTimeout=60000
spring.datasource.username=${DB_USERNAME:db53163}
spring.datasource.password=${DB_PASSWORD:C%t4!2XaQr5_}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver


# HikariCP — raised from 5 to 20 to handle concurrent users without connection starvation.
# Formula: (core_count * 2) + effective_spindle_count; 20 is safe for shared cloud DB.
spring.datasource.hikari.maximum-pool-size=20
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.idle-timeout=600000
spring.datasource.hikari.max-lifetime=1800000
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.validation-timeout=5000
spring.datasource.hikari.keepalive-time=60000
spring.datasource.hikari.pool-name=ScheduleHikariPool

spring.jpa.database-platform=org.hibernate.dialect.MySQL8Dialect

# Hibernate JDBC Batching — critical for saveAll() to send rows in bulk rather than
# one-at-a-time. Works together with rewriteBatchedStatements=true in the JDBC URL.
spring.jpa.properties.hibernate.jdbc.batch_size=50
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.properties.hibernate.order_updates=true
spring.jpa.properties.hibernate.jdbc.batch_versioned_data=true
# Generate statistics in debug mode only — disable in production to avoid overhead
# spring.jpa.properties.hibernate.generate_statistics=true

# CORS — list your exact frontend origins; wildcard '*' is rejected when credentials=true
