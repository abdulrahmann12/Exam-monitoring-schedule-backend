spring.application.name=uniguard-schedule-api

# ─────────────────────────────────────────────────────────────────────────────
# SECRETS & ENVIRONMENT
# Every credential comes from an environment variable. Values marked REQUIRED have
# no default on purpose: the application refuses to start without them instead of
# silently running with a publicly known value. See .env.example for the full list.
# ─────────────────────────────────────────────────────────────────────────────

# Database (REQUIRED)
# rewriteBatchedStatements=true makes hibernate.jdbc.batch_size send real JDBC batches.
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# HikariCP
spring.datasource.hikari.maximum-pool-size=${DB_POOL_SIZE:20}
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.idle-timeout=600000
spring.datasource.hikari.max-lifetime=1800000
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.validation-timeout=5000
spring.datasource.hikari.keepalive-time=60000
spring.datasource.hikari.pool-name=ScheduleHikariPool

spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect

# Hibernate JDBC batching (works together with rewriteBatchedStatements=true in DB_URL)
spring.jpa.properties.hibernate.jdbc.batch_size=50
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.properties.hibernate.order_updates=true
spring.jpa.properties.hibernate.jdbc.batch_versioned_data=true

# CORS — comma-separated list of exact frontend origins (REQUIRED in production).
# Never use wildcards such as https://*.vercel.app: anyone can deploy a site there.
app.cors.allowed-origin-patterns=${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000}

# First administrator — used ONLY when no administrator exists yet.
# Restarting never changes an existing password. To recover a lost password set
# BOOTSTRAP_ADMIN_RESET_PASSWORD=true for exactly one restart, then remove it.
app.bootstrap-admin.email=${BOOTSTRAP_ADMIN_EMAIL:}
app.bootstrap-admin.password=${BOOTSTRAP_ADMIN_PASSWORD:}
app.bootstrap-admin.reset-password=${BOOTSTRAP_ADMIN_RESET_PASSWORD:false}

# Platform owner (super-admin): runs the owner panel, belongs to no university, sees no
# university data. Optional; created ONLY when no owner exists yet. The email must not
# already belong to a university account. Recovery: BOOTSTRAP_OWNER_RESET_PASSWORD=true once.
app.bootstrap-owner.email=${BOOTSTRAP_OWNER_EMAIL:}
app.bootstrap-owner.password=${BOOTSTRAP_OWNER_PASSWORD:}
app.bootstrap-owner.reset-password=${BOOTSTRAP_OWNER_RESET_PASSWORD:false}

# Two-step sign-in (authenticator apps). The key encrypts the stored secrets: 32 random bytes,
# Base64 (openssl rand -base64 32). Keep it stable and separate from JWT_SECRET; without it
# two-step sign-in cannot be switched on. Changing it breaks existing set-ups (recovery codes still work).
app.mfa.encryption-key=${MFA_ENCRYPTION_KEY:}
app.mfa.issuer=${MFA_ISSUER:Uni-Guard Schedules}

# Sign-in with Microsoft / Google (optional; a button appears only when its id and secret are set).
# Register this redirect URI with the provider: <APP_SSO_CALLBACK_BASE_URL>/api/auth/sso/<google|microsoft>/callback
# (defaults to APP_FRONTEND_URL, which forwards /api to the backend).
app.sso.callback-base-url=${APP_SSO_CALLBACK_BASE_URL:}
app.sso.google.client-id=${GOOGLE_CLIENT_ID:}
app.sso.google.client-secret=${GOOGLE_CLIENT_SECRET:}
app.sso.google.authorization-uri=https://accounts.google.com/o/oauth2/v2/auth
app.sso.google.token-uri=https://oauth2.googleapis.com/token
app.sso.google.jwks-uri=https://www.googleapis.com/oauth2/v3/certs
app.sso.google.issuer=https://accounts.google.com
app.sso.microsoft.client-id=${MICROSOFT_CLIENT_ID:}
app.sso.microsoft.client-secret=${MICROSOFT_CLIENT_SECRET:}
# organizations = any work/school account (recommended); or one organisation's tenant id
app.sso.microsoft.tenant=${MICROSOFT_TENANT:organizations}
app.sso.microsoft.authority=https://login.microsoftonline.com

# Email outbox: background sending with retries; delivery log kept this many days.
app.mail.outbox.worker-enabled=${MAIL_WORKER_ENABLED:true}
app.mail.outbox.poll-ms=5000
app.mail.outbox.retention-days=${MAIL_LOG_RETENTION_DAYS:90}

# Public demo login. OFF by default; enable only on a dedicated demo deployment.
# Demo sessions are strictly read-only on the server.
app.demo.enabled=${DEMO_MODE_ENABLED:false}

# JWT (secret REQUIRED, at least 32 characters — generate with: openssl rand -base64 48)
app.jwt.secret=${JWT_SECRET}
# Access tokens are short-lived; the browser renews them silently with the refresh cookie.
app.jwt.expiration-minutes=${JWT_EXPIRATION_MINUTES:15}

# Login cookies (HttpOnly; JavaScript cannot read them).
#   AUTH_COOKIE_SAME_SITE=Lax  when frontend and API are on the same site (recommended: proxy /api
#                              through the frontend domain). Use None only for different sites.
#   AUTH_COOKIE_SECURE=false   only for plain-http local development.
app.auth.cookie.secure=${AUTH_COOKIE_SECURE:true}
app.auth.cookie.same-site=${AUTH_COOKIE_SAME_SITE:Lax}
app.auth.cookie.domain=${AUTH_COOKIE_DOMAIN:}
app.auth.cookie.session-days=${AUTH_SESSION_DAYS:7}
app.auth.cookie.max-sessions-per-user=${AUTH_MAX_SESSIONS_PER_USER:20}

# Invitation and password-reset links (emails). APP_FRONTEND_URL is REQUIRED in production:
# links are always built from it, never from request headers.
app.account.frontend-base-url=${APP_FRONTEND_URL:http://localhost:5173}
app.account.invite-hours=${APP_INVITE_HOURS:72}
app.account.reset-minutes=${APP_RESET_LINK_MINUTES:30}
# Never enable in production: writes working links to the log when email is not configured.
app.account.log-links=${APP_LOG_ACCOUNT_LINKS:false}

# Activity log: entries older than this are deleted nightly (0 = keep forever).
app.audit.retention-days=${APP_AUDIT_RETENTION_DAYS:365}

# Account lockout: N consecutive wrong passwords lock the account (0 = off). Default 2 days.
# Sign-in attempts per IP address per minute. Behind Vercel (/api forwarded) many users share a few
# addresses: use about 60 there. The per-account lock below protects each account either way.
app.security.login-rate-limit-per-minute=${LOGIN_RATE_LIMIT_PER_MINUTE:10}
app.security.lockout.max-failed-attempts=${LOGIN_MAX_FAILED_ATTEMPTS:5}
app.security.lockout.duration-minutes=${LOGIN_LOCK_DURATION_MINUTES:2880}

# Mail — Brevo transactional API. Optional: without a key, "notify staff" reports an error.
app.brevo.api-key=${BREVO_API_KEY:}
app.brevo.sender-email=${BREVO_SENDER_EMAIL:}
app.brevo.sender-name=${BREVO_SENDER_NAME:Uni-Guard Schedules}
# Test safety net (leave empty in production): comma-separated addresses; when set, email goes ONLY to them
# and every other recipient is skipped and logged as "not sent".
app.mail.allowed-recipients=${MAIL_ALLOWED_RECIPIENTS:}

# Real client IPs behind a reverse proxy (Hugging Face, Nginx, load balancers).
# Tomcat only trusts X-Forwarded-For when the direct peer is an internal proxy (private address
# ranges by default), so clients cannot spoof their IP to bypass the login rate limiter.
# If your proxy has a public address, set SERVER_TOMCAT_REMOTEIP_INTERNAL_PROXIES to a regex for it.
server.forward-headers-strategy=native

# ─────────────────────────────────────────────────────────────────────────────
# SCHEMA — Flyway owns the schema (src/main/resources/db/migration).
# Existing databases created by the old ddl-auto=update are baselined at V1 automatically;
# fresh databases run every script. Hibernate only *validates* that entities match the schema.
# ─────────────────────────────────────────────────────────────────────────────
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=1
spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:validate}
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# Misc
spring.main.banner-mode=off
spring.jackson.date-format=yyyy-MM-dd HH:mm:ss
spring.jackson.serialization.FAIL_ON_EMPTY_BEANS=false
spring.messages.basename=message
spring.thymeleaf.check-template-location=false

# Logging — INFO for our own code so security/bootstrap events are visible in deployed logs.
logging.level.root=WARN
logging.level.org.hibernate.SQL=ERROR
logging.level.org.flywaydb=INFO
logging.level.com.uniguard.schedule=${APP_LOG_LEVEL:INFO}
