spring.application.name=schdule-management-api

# Database Configuration
# rewriteBatchedStatements=true: activates true JDBC batching in MySQL driver so that
# Hibernate's hibernate.jdbc.batch_size setting actually sends statements in a single
# network round-trip instead of individual round-trips.
spring.datasource.url=jdbc:mysql://db50370.public.databaseasp.net:3306/db50370?useSSL=true&requireSSL=false&serverTimezone=UTC&zeroDateTimeBehavior=convertToNull&rewriteBatchedStatements=true&cachePrepStmts=true&prepStmtCacheSize=250&prepStmtCacheSqlLimit=2048
spring.datasource.username=${DB_USERNAME:db50370}
spring.datasource.password=${DB_PASSWORD:n=8X-Ww4H7!c}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver


# HikariCP — raised from 5 to 20 to handle concurrent users without connection starvation.
# Formula: (core_count * 2) + effective_spindle_count; 20 is safe for shared cloud DB.
spring.datasource.hikari.maximum-pool-size=20
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.idle-timeout=600000
spring.datasource.hikari.max-lifetime=1800000
spring.datasource.hikari.connection-timeout=8000
spring.datasource.hikari.validation-timeout=3000
spring.datasource.hikari.keepalive-time=60000
spring.datasource.hikari.pool-name=ScheduleHikariPool

spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect

# Hibernate JDBC Batching — critical for saveAll() to send rows in bulk rather than
# one-at-a-time. Works together with rewriteBatchedStatements=true in the JDBC URL.
spring.jpa.properties.hibernate.jdbc.batch_size=50
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.properties.hibernate.order_updates=true
spring.jpa.properties.hibernate.jdbc.batch_versioned_data=true
# Generate statistics in debug mode only — disable in production to avoid overhead
# spring.jpa.properties.hibernate.generate_statistics=true

# CORS — list your exact frontend origins; wildcard '*' is rejected when credentials=true
app.cors.allowed-origin-patterns[0]=http://localhost:4200
app.cors.allowed-origin-patterns[1]=http://localhost:3000
app.cors.allowed-origin-patterns[2]=http://localhost:5173
app.cors.allowed-origin-patterns[3]=https://your-frontend.hf.space
app.cors.allowed-origin-patterns[4]=https://your-app.vercel.app
app.cors.allowed-origin-patterns[5]=https://*.vercel.app


