# Test profile — in-memory H2 in MySQL compatibility mode. No external services needed.
spring.datasource.url=jdbc:h2:mem:uniguard;MODE=MySQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH;DB_CLOSE_DELAY=-1;LOCK_TIMEOUT=10000
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=test
spring.datasource.hikari.minimum-idle=1
spring.datasource.hikari.maximum-pool-size=10
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect

# Flyway scripts are MySQL-specific; tests build the schema from the entities instead.
# The migrations themselves are verified against a real MySQL in CI (MySqlMigrationIT).
spring.flyway.enabled=false
spring.jpa.hibernate.ddl-auto=create-drop

app.demo.enabled=false
app.jwt.secret=test-only-secret-key-that-is-long-enough-1234567890
app.bootstrap-admin.email=admin@test.local
app.bootstrap-admin.password=test-password
app.bootstrap-owner.email=owner@test.local
app.bootstrap-owner.password=owner-password-1
app.brevo.api-key=test
app.brevo.sender-email=test@test.local
logging.level.schedule.example.schedule=WARN
# Plain http in local runs and tests
app.auth.cookie.secure=false
