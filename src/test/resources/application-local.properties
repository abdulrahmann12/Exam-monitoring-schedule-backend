# LOCAL DEVELOPMENT ONLY — run the app without MySQL:
#
#   mvn spring-boot:run -Dspring-boot.run.useTestClasspath=true -Dspring-boot.run.profiles=local
#
# Lives in src/test/resources, so it is never packaged into the production jar.
# Data is kept in ./data/local.mv.db (git-ignored); delete that file to start fresh.

spring.datasource.url=jdbc:h2:file:./data/local;MODE=MySQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH;AUTO_SERVER=TRUE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=local
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect

# Flyway scripts are MySQL-specific; locally Hibernate builds the H2 schema from the entities.
spring.flyway.enabled=false
spring.jpa.hibernate.ddl-auto=update

app.jwt.secret=local-development-only-secret-not-for-production-0123456789
app.bootstrap-admin.email=admin@local.test
app.bootstrap-admin.password=LocalAdmin123
app.demo.enabled=true
app.cors.allowed-origin-patterns=http://localhost:5173,http://localhost:8080
# Plain http in local runs and tests
app.auth.cookie.secure=false
# No email locally: invitation / reset links are printed in the backend log
app.account.log-links=true
