name: Backend CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: backend-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Build & unit/integration tests (H2)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: Build and test
        run: mvn -B verify
      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-reports
          path: target/surefire-reports

  mysql-migrations:
    # Production runs on MariaDB 10.11 (databaseasp.net); MySQL 8 is checked too for other installs.
    name: Flyway migrations on ${{ matrix.name }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: MySQL 8.0
            image: mysql:8.0
            health: mysqladmin ping -h 127.0.0.1 -proot
          - name: MariaDB 10.11
            image: mariadb:10.11
            health: healthcheck.sh --connect --innodb_initialized
    services:
      mysql:
        image: ${{ matrix.image }}
        env:
          MYSQL_ROOT_PASSWORD: root
          MARIADB_ROOT_PASSWORD: root
        ports:
          - 3306:3306
        options: >-
          --health-cmd="${{ matrix.health }}"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=30
    env:
      MYSQL_IT_URL_BASE: jdbc:mysql://127.0.0.1:3306/
      MYSQL_IT_USER: root
      MYSQL_IT_PASSWORD: root
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: Fresh install + upgrade-from-Hibernate checks
        run: mvn -B test -Dtest='MySql*IT' -Dsurefire.failIfNoSpecifiedTests=false
