name: Sync to Hugging Face

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sync-to-huggingface-${{ github.ref }}
  cancel-in-progress: true

jobs:
  sync:
    runs-on: ubuntu-latest

    steps:
      - name: Validate required configuration
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          HF_SPACE_REPO_ID: ${{ vars.HF_SPACE_REPO_ID }}
        run: |
          if [ -z "$HF_TOKEN" ]; then
            echo "Missing GitHub Actions secret: HF_TOKEN"
            exit 1
          fi

          if [ -z "$HF_SPACE_REPO_ID" ]; then
            echo "Missing GitHub Actions variable: HF_SPACE_REPO_ID"
            exit 1
          fi

      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Push repository to Hugging Face Space
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          HF_SPACE_REPO_ID: ${{ vars.HF_SPACE_REPO_ID }}
        run: |
          CREDENTIAL_FILE="$RUNNER_TEMP/hf-git-credentials"
          umask 077

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git config credential.helper "store --file=$CREDENTIAL_FILE"
          git remote add huggingface "https://huggingface.co/spaces/${HF_SPACE_REPO_ID}"

          cat <<EOF > "$CREDENTIAL_FILE"
          https://oauth2:${HF_TOKEN}@huggingface.co
          EOF

          cleanup_credentials() {
            if ! rm -f "$CREDENTIAL_FILE"; then
              echo "Warning: failed to delete temporary Hugging Face credentials"
            fi
          }
          trap cleanup_credentials EXIT

          echo "Syncing commit $(git rev-parse --short HEAD) to Hugging Face Space ${HF_SPACE_REPO_ID}"

          if ! GIT_TERMINAL_PROMPT=0 git push --force huggingface HEAD:main; then
            cleanup_credentials
            echo "Failed to sync to Hugging Face. Check HF_TOKEN permissions and HF_SPACE_REPO_ID."
            exit 1
          fi

          cleanup_credentials
