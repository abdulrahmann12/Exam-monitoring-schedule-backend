name: Sync to Hugging Face hub

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  sync-to-hub:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          lfs: true

      - name: Push to hub
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          git remote add huggingface https://abdulraahmann:${HF_TOKEN}@huggingface.co/spaces/abdulraahmann/schedule-backend || \
            git remote set-url huggingface https://abdulraahmann:${HF_TOKEN}@huggingface.co/spaces/abdulraahmann/schedule-backend
          git push --force huggingface main
